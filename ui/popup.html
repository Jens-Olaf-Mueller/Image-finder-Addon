<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Finder</title>

    <link rel="stylesheet" href="./popup.css">
    <link rel="stylesheet" href="./settings.css">
    <script src="../src/popup.js" type="module"></script>
</head>

<body>
    <!-- Top toolbar -->
    <div id="divTopToolbar" class="toolbar toolbar__top" role="toolbar" aria-label="Image sorting and preview controls">
        <div id="divToolbarTopLeft" class="toolbar-section" role="group" aria-label="Image list sorting">
            <button type="button" id="btnSortFilename" class="toolbar-button tbr-btn__small"
                title="Sort by filename"
                aria-label="Sort by filename"
                data-sort="filename">
                <img src="../assets/icons/sort-alphabetical.png" alt="sort-alphabetical">
            </button>
            <button type="button" id="btnSortType" class="toolbar-button tbr-btn__small"
                title="Sort by image type"
                aria-label="Sort by image type"
                data-sort="type">
                <img src="../assets/icons/sort-type.png" alt="sort type">
            </button>
            <button type="button" id="btnSortFileSize" class="toolbar-button tbr-btn__small"
                title="Sort by file size"
                aria-label="Sort by file size"
                data-sort="size">
                <img src="../assets/icons/sort-size.png" alt="sort size">
            </button>
            <button type="button" id="btnSortDimensions" class="toolbar-button tbr-btn__small"
                title="Sort by dimensions"
                aria-label="Sort by dimensions"
                data-sort="dimensions">
                <img src="../assets/icons/sort-dims.png" alt="sort dimensions">
            </button>
        </div>
        <div id="divToolbarTopRight" class="toolbar-section" role="group" aria-label="Image preview controls">
            <div class="dummy"></div>
            <div class="control theme">
                <label title="Switch theme">
                    <input type="checkbox" id="chkTheme" name="theme" title="Switch theme" aria-label="Switch theme">
                    <img class="theme-light" src="../assets/icons/sun.png" alt="sun">
                    <img class="theme-dark" src="../assets/icons/moon.png" alt="moon">
                </label>
            </div>
        </div>
    </div>

    <main class="mainGUI">
        <!-- Image list -->
        <div id="divImageList" class="image-list">
            <ul id="lstImages" class="images" tabindex="0"></ul>
        </div>

        <!-- Image preview -->
        <div id="divPreview" class="preview">
            <img id="imgPreview" class="preview">
            <h2 id="h2_Preview">Image preview</h2>
        </div>
    </main>

    <!-- Toolbar -->
    <div id="divToolbar" class="toolbar" role="toolbar" aria-label="Image actions">
        <button type="button" id="btnSearch" class="toolbar-button"
            title="Find images"
            aria-label="Find images">
            <img src="../assets/icons/search.png" alt="find">
        </button>

        <button type="button" id="btnScan" class="toolbar-button"
            title="Scan this image"
            aria-label="Scan this image"
            disabled>
            <img src="../assets/icons/scan.png" alt="scan">
        </button>

        <button type="button" id="btnDownload" class="toolbar-button"
            title="Download image"
            aria-label="Download image"
            disabled>
            <img src="../assets/icons/download.png" alt="download">
        </button>

        <button type="button" id="btnSaveAll" class="toolbar-button"
            title="Save all"
            aria-label="Save all"
            disabled>
            <img src="../assets/icons/saveall.png" alt="save all">
        </button>

        <button type="button" id="btnDelete" class="toolbar-button"
            title="Delete image"
            aria-label="Delete image"
            disabled>
            <img src="../assets/icons/bin.png" alt="delete">
        </button>

        <button type="button" id="btnClear" class="toolbar-button"
            title="Clear list"
            aria-label="Clear list"
            disabled>
            <img src="../assets/icons/clear.png" alt="clear list">
        </button>

        <button type="button" id="btnRestart" class="toolbar-button"
            title="Start addon new"
            aria-label="Start addon new">
            <img src="../assets/icons/restart.png" alt="restart">
        </button>

        <div id="divToolbarSpacer" class="toolbar-spacer">
            <span id="spnStatusBar" class="statusbar"></span>
            <div id="divProgressbar" class="progressbar">0%</div>
        </div>

        <button type="button" id="btnSettings" class="toolbar-button"
            title="Settings"
            aria-label="Settings"
            value="false">
            <img src="../assets/icons/settings.png" alt="settings">
        </button>
    </div>

    <div id="divSettingsPanel" class="settings-panel" aria-label="Settings">
        <div id="divSettingsContentPopup"></div>
    </div>
</body>
</html>
