<form id="frmSettings">
    <fieldset name="common"><legend>Common settings</legend>
        <label class="control">
            <input type="checkbox" id="chkScanOnStart" name="scanOnStart" checked>
             Scan current page on addon start
        </label>
        <label class="control" title="Executes a deep scan in the background for better results">
            <input type="checkbox" id="chkAllowBackgroundScan" name="allowBackgroundScan">
             Allow background scan
        </label>
        <label class="control" title="Allows the isolated deep scan to retry protected pages without affecting the visible tab">
            <input type="checkbox" id="chkAllowProtectedDeepScan" name="allowProtectedDeepScan"
            style="margin-left: 1rem;">
             Allow DeepScan on protected sites
        </label>
        <label class="control">
            <input type="checkbox" id="chkSaveSettingsForURL" name="saveSettingsForURL">
             Remember settings for this URL
        </label>
        <div class="control">
            <label for="inpKeepSettingsForDays">Keep settings for</label>
            <input type="number"
                id="inpKeepSettingsForDays"
                name="keepSettingsForDays"
                min="1"
                max="365"
                value="365"
                disabled>
            <span> days  </span>
            <button type="button" id="btnDeleteProfile" class="folder-button"
                title="Delete settings for this profile" disabled>
                <svg class="folder-button__icon" aria-hidden="true">
                    <use href="../assets/icons/button-icons.svg#svgBin"></use>
                </svg>
            </button>
        </div>
    </fieldset>

    <fieldset name="downloads"><legend>Downloads</legend>
        <label class="control">
            <input type="radio" id="radPromptDownloadFolder" name="downloadFolder" value="prompt" checked>
             Always prompt for download folder
        </label>
        <div class="control ctrl__vertical">
            <label>
                <input type="radio" id="radUserFolder" name="downloadFolder" value="user">
                 Use this download subfolder
            </label>
            <div class="control">
                <input type="text" id="inpUserFolder" name="userFolder" disabled>
                <button type="button" id="btnDownloadFolder" class="folder-button" disabled title="Change the browser's default download folder">
                    <svg class="folder-button__icon" aria-hidden="true">
                        <use href="../assets/icons/button-icons.svg#svgFolder"></use>
                    </svg>
                </button>
            </div>
        </div>
        <label class="control">
            <input type="checkbox" id="chkZipFileList" name="zipFileList">
             Save whole list as zip file
        </label>
        <label class="control" title="to avoid downloading the same file multiple times">
            <input type="checkbox" id="chkDisableDownloadWhenDone" name="disableDownloadWhenDone">
             Disable download button on done files
        </label>
    </fieldset>

    <fieldset name="filesizes"><legend>Image Size</legend>
        <label id="lblIgnoreImageSizes" class="control">
            <input type="checkbox" id="chkIgnoreSizes" name="ignoresizes" checked/>
             Ignore images smaller than:
        </label>
        <div class="control">
            <label id="lblMinimumWidth" for="inpMinWidth">Minimum width:</label>
            <input type="number" id="inpMinWidth" name="minwidth" min="16" max="10000" step="10" value="100"/>
            <span> px</span>
        </div>
        <div class="control">
            <label id="lblMinimumHeight" for="inpMinHeight">Minimum height:</label>
            <input type="number" id="inpMinHeight" name="minheight" min="16" max="10000" step="10" value="100"/>
            <span> px</span>
        </div>
        <div class="control">
            <label id="lblMinimumFileSize" for="inpMinimumFileSize">Minimum file size:</label>
            <input type="number" id="inpMinimumFileSize" name="minimumfilesize" min="16" max="1024" step="16" value="64"/>
            <span id="spnMinSize"> KB</span>
        </div>
    </fieldset>

    <fieldset name="filters"><legend>Filtering</legend>
        <label id="lblIgnoreDuplicates" class="control">
            <input type="checkbox" id="chkIgnoreDuplicates" name="ignoreDuplicates" checked/>
             Ignore duplicates
        </label>
        <label id="lblIgnoreHiddenImages" class="control">
            <input type="checkbox" id="chkIgnoreHiddenImages" name="ignoreHiddenImages"/>
             Ignore hidden images
        </label>
        <label id="lblIgnoreBlurredImages" class="control">
            <input type="checkbox" id="chkIgnoreBlurredImages" name="ignoreBlurredImages" checked/>
             Ignore blurred images
        </label>
        <div class="control ctrl__vertical">
            <label>
                <input type="checkbox" id="chkExcludeList" name="hasExcludeList">
                 Ignore images containing in filename:
            </label>
            <input type="text" id="inpExcludeList" name="excludeList" disabled>
        </div>
    </fieldset>

    <fieldset name="imagetypes"><legend>Media Types</legend>
        <label id="lblJpg" class="control" data-media="image">
            <input type="checkbox" id="chkJpg" name="jpg" checked/>
            <img src="/assets/icons/jpeg.png" alt="jpg" class="media-icon">
             .jpg / .jpeg
        </label>
        <label id="lblPng" class="control" data-media="image">
            <input type="checkbox" id="chkPng" name="png" checked/>
            <img src="/assets/icons/png.png" alt="png" class="media-icon">
             .png
        </label>
        <label id="lblBmp" class="control" data-media="image">
            <input type="checkbox" id="chkBmp" name="bmp" checked/>
            <img src="/assets/icons/bmp.png" alt="bmp" class="media-icon">
             .bmp
        </label>
        <label id="lblWebp" class="control" data-media="image">
            <input type="checkbox" id="chkWebp" name="webp" checked/>
            <img src="/assets/icons/webp.png" alt="webp" class="media-icon">
             .webp
        </label>
        <label id="lblGif" class="control" data-media="image">
            <input type="checkbox" id="chkGif" name="gif" checked/>
            <img src="/assets/icons/gif.png" alt="gif" class="media-icon">
             .gif
        </label>
        <label id="lblSvg" class="control" data-media="image">
            <input type="checkbox" id="chkSvg" name="svg"/>
            <img src="/assets/icons/svg.png" alt="svg" class="media-icon">
             .svg
        </label>
        <label id="lblAvif" class="control" data-media="image">
            <input type="checkbox" id="chkAvif" name="avif"/>
            <img src="/assets/icons/avif.png" alt="avif" class="media-icon">
             .avif
        </label>

        <!-- .mp4 | .webm | .mov | .mkv | .avi | .wmv | .ogg? -->
        <label id="lblMp4" class="control hidden" data-media="video">
            <input type="checkbox" id="chkMp4" name="mp4"/>
            <img src="/assets/icons/mp4.png" alt="mp4" class="media-icon">
             .mp4
        </label>
        <label id="lblMov" class="control hidden" data-media="video">
            <input type="checkbox" id="chkMov" name="mov"/>
            <img src="/assets/icons/mov.png" alt="mov" class="media-icon">
             .mov
        </label>
        <label id="lblMkv" class="control hidden" data-media="video">
            <input type="checkbox" id="chkMkv" name="mkv"/>
            <img src="/assets/icons/mkv.png" alt="mkv" class="media-icon">
             .mkv
        </label>
        <label id="lblWebm" class="control hidden" data-media="video">
            <input type="checkbox" id="chkWebm" name="webm"/>
            <img src="/assets/icons/webm.png" alt="webm" class="media-icon">
             .webm
        </label>
        <label id="lblWmv" class="control hidden" data-media="video">
            <input type="checkbox" id="chkWmv" name="wmv"/>
            <img src="/assets/icons/wmv.png" alt="wmv" class="media-icon">
             .wmv
        </label>
        <label id="lblAvi" class="control hidden" data-media="video">
            <input type="checkbox" id="chkAvi" name="avi"/>
            <img src="/assets/icons/avi.png" alt="avi" class="media-icon">
             .avi
        </label>

        <!-- .mp3 | .wav | .acc | .ogg | .opus | .flac | . -->
    </fieldset>

    <fieldset name="sources"><legend>Image Sources</legend>
        <label id="lblImageElements" class="control">
            <input type="checkbox" id="chkImageElements" name="imageelements" checked/>
             Image elements
        </label>
        <label id="lblBackgroundImages" class="control">
            <input type="checkbox" id="chkBackgroundImages" name="backgroundimages" checked/>
             CSS background images
        </label>
        <label id="lblLinkedImages" class="control">
            <input type="checkbox" id="chkLinkedImages" name="linkedimages" checked/>
             Linked images
        </label>
        <label id="lblDataImages" class="control">
            <input type="checkbox" id="chkDataImages"  name="dataimages"/>
             Data images
        </label>
        <label id="lblBlobImages" class="control">
            <input type="checkbox" id="chkBlobImages" name="blobimages"/>
             Blob images
        </label>
    </fieldset>

    <fieldset name="debug"><legend>Debugging</legend>
        <label id="lblDebugmode" class="control">
            <input type="checkbox" id="chkDebugmode" name="debugmode">
            Enable debugmode
        </label>
        <label id="lblLogTabConsole" class="control">
            <input type="checkbox" id="chkLogTabConsole" name="logtab" disabled style="margin-left: 1rem;">
            Log current tab messages into file
        </label>
        <label id="lblLogPopupConsole" class="control">
            <input type="checkbox" id="chkLogPopupConsole" name="logpopup" disabled style="margin-left: 1rem;">
            Log popup messages into file
        </label>
        <label id="lblLogServiceWorkerConsole" class="control">
            <input type="checkbox" id="chkLogServiceWorkerConsole" name="logserviceworker" disabled style="margin-left: 1rem;">
            Log service worker messages into file
        </label>
    </fieldset>
</form>
