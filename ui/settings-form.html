<form id="frmSettings">
    <fieldset name="common"><legend>Common settings</legend>
        <label class="control">
            <input type="checkbox" id="chkScanOnStart" name="scanOnStart" checked>
             Scan current page on addon start
        </label>
        <label class="control" title="Executes a deep scan in the background for better results">
            <input type="checkbox" id="chkAllowBackgroundScan" name="allowBackgroundScan">
             Allow background scan
        </label>
        <label class="control" title="Scans the current page automatically again when settings panel is closed">
            <input type="checkbox" id="chkScanOnSettingsChanged" name="scanOnSettingsChanged" checked>
             Re-scan page after settings are closed
        </label>

        <label class="control">
            <input type="checkbox" id="chkSaveSettingsForURL" name="saveSettingsForURL">
             Remember settings for this URL
        </label>
        <div class="control">
            <label for="inpKeepSettingsForDays">Keep settings for</label>
            <input type="number"
                id="inpKeepSettingsForDays"
                name="keepSettingsForDays"
                min="1"
                max="365"
                value="30"
                disabled>
            <span> days</span>
        </div>

        <div class="control">
            <button type="button" id="btnDeleteProfile" class="folder-button" disabled>
                <img src="../assets/icons/bin.png" alt="delete">
            </button>
            <span> Delete settings for this profile</span>
        </div>

    </fieldset>

    <fieldset name="downloads"><legend>Downloads</legend>
        <label class="control">
            <input type="radio" id="radPromptDownloadFolder" name="downloadFolder" value="prompt" checked>
             Always prompt for download folder
        </label>
        <div class="control ctrl__vertical">
            <label>
                <input type="radio" id="radUserFolder" name="downloadFolder" value="user">
                 Use this download subfolder
            </label>
            <div class="control">
                <input type="text" id="inpUserFolder" name="userFolder" disabled>
                <button type="button" id="btnDownloadFolder" class="folder-button" disabled title="Change the browser's default download folder">
                    <img src="../assets/icons/folder.png" alt="folder">
                </button>
            </div>
        </div>
        <label class="control">
            <input type="checkbox" id="chkZipFileList" name="zipFileList">
             Save whole list as zip file
        </label>
        <label class="control" title="to avoid downloading the same file multiple times">
            <input type="checkbox" id="chkDisableDownloadWhenDone" name="disableDownloadWhenDone">
             Disable download button on done files
        </label>

    </fieldset>

    <fieldset name="filesizes"><legend>Image Size</legend>
        <label id="lblIgnoreImageSizes" class="control">
            <input type="checkbox" id="chkIgnoreSizes" name="ignoresizes" checked/>
             Ignore images smaller than:
        </label>
        <div class="control">
            <label id="lblMinimumWidth" for="inpMinWidth">Minimum width:</label>
            <input type="number" id="inpMinWidth" name="minwidth" min="16" max="10000" step="10" value="100"/>
            <span> px</span>
        </div>
        <div class="control">
            <label id="lblMinimumHeight" for="inpMinHeight">Minimum height:</label>
            <input type="number" id="inpMinHeight" name="minheight" min="16" max="10000" step="10" value="100"/>
            <span> px</span>
        </div>
        <div class="control">
            <label id="lblMinimumFileSize" for="inpMinimumFileSize">Minimum file size:</label>
            <input type="number" id="inpMinimumFileSize" name="minimumfilesize" min="16" max="1024" step="16" value="64"/>
            <span id="spnMinSize"> KB</span>
        </div>
    </fieldset>

    <fieldset name="filters"><legend>Filtering</legend>
        <label id="lblIgnoreDuplicates" class="control">
            <input type="checkbox" id="chkIgnoreDuplicates" name="ignoreDuplicates" checked/>
             Ignore duplicates
        </label>
        <label id="lblIgnoreHiddenImages" class="control">
            <input type="checkbox" id="chkIgnoreHiddenImages" name="ignoreHiddenImages"/>
             Ignore hidden images
        </label>
        <label id="lblIgnoreBlurredImages" class="control">
            <input type="checkbox" id="chkIgnoreBlurredImages" name="ignoreBlurredImages" checked/>
             Ignore blurred images
        </label>
        <div class="control ctrl__vertical">
            <label>
                <input type="checkbox" id="chkExcludeList" name="hasExcludeList">
                 Ignore images containing in filename:
            </label>
            <input type="text" id="inpExcludeList" name="excludeList" disabled>
        </div>
    </fieldset>

    <fieldset name="imagetypes"><legend>Image Types</legend>
        <label id="lblJpg" class="control">
            <input type="checkbox" id="chkJpg" name="jpg" checked/>
             .jpg / .jpeg
        </label>
        <label id="lblPng" class="control">
            <input type="checkbox" id="chkPng" name="png" checked/>
             .png
        </label>
        <label id="lblBmp" class="control">
            <input type="checkbox" id="chkBmp" name="bmp" checked/>
             .bmp
        </label>
        <label id="lblWebp" class="control">
            <input type="checkbox" id="chkWebp" name="webp" checked/>
             .webp
        </label>
        <label id="lblGif" class="control">
            <input type="checkbox" id="chkGif" name="gif" checked/>
             .gif
        </label>
        <label id="lblSvg" class="control">
            <input type="checkbox" id="chkSvg" name="svg"/>
             .svg
        </label>
        <label id="lblAvif" class="control">
            <input type="checkbox" id="chkAvif" name="avif"/>
             .avif
        </label>
    </fieldset>

    <fieldset name="sources"><legend>Image Sources</legend>
        <label id="lblImageElements" class="control">
            <input type="checkbox" id="chkImageElements" name="imageelements" checked/>
             Image elements
        </label>
        <label id="lblBackgroundImages" class="control">
            <input type="checkbox" id="chkBackgroundImages" name="backgroundimages" checked/>
             CSS background images
        </label>
        <label id="lblLinkedImages" class="control">
            <input type="checkbox" id="chkLinkedImages" name="linkedimages" checked/>
             Linked images
        </label>
        <label id="lblDataImages" class="control">
            <input type="checkbox" id="chkDataImages"  name="dataimages"/>
             Data images
        </label>
        <label id="lblBlobImages" class="control">
            <input type="checkbox" id="chkBlobImages" name="blobimages"/>
             Blob images
        </label>
    </fieldset>
</form>
