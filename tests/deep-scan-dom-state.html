<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>DeepScan DOM state fixture</title>
</head>
<body>
    <main id="mainTestRoot"></main>
    <script type="module">
        const {default: DeepScanDOMState} = await import('../src/classes/DeepScanDOMState.js');
        const testRoot = document.getElementById('mainTestRoot');
        const waitForMutations = () => new Promise((resolve) => setTimeout(resolve, 0));
        const assert = (condition, message) => {
            if (!condition) throw new Error(message);
        };

        try {
            const activities = [];
            const state = new DeepScanDOMState({
                scanDocument: document,
                mutationAttributes: ['src'],
                onActivity: (activity) => activities.push(activity)
            });
            state.start();

            const initialScope = state.consumeScope('initial');
            assert(initialScope.roots[0] === document, 'Initial scope must scan the document.');

            const directTarget = document.createElement('button');
            const firstImage = document.createElement('img');
            directTarget.append(firstImage);
            testRoot.append(directTarget);
            state.registerDirectTarget(directTarget);
            await waitForMutations();

            const directScope = state.consumeScope();
            assert(directScope.roots.includes(directTarget),
                'A changed direct target must become its own delta root.');

            activities.length = 0;
            const textOnlyElement = document.createElement('article');
            textOnlyElement.textContent = 'This UI update contains no media source.';
            testRoot.append(textOnlyElement);
            await waitForMutations();

            const textOnlyActivity = activities.at(-1);
            assert(textOnlyActivity.records.length > 0,
                'A text-only UI update must remain available to delta collection.');
            assert(textOnlyActivity.settleRecords.length === 0,
                'A text-only UI update must not postpone DeepScan settling.');
            const textOnlyScope = state.consumeScope();
            assert(textOnlyScope.roots.includes(textOnlyElement),
                'A text-only UI update must retain its narrow delta root.');

            activities.length = 0;
            const addedImage = document.createElement('img');
            addedImage.src = '/images/added.jpg';
            testRoot.append(addedImage);
            await waitForMutations();

            const imageActivity = activities.at(-1);
            assert(imageActivity.settleRecords.length > 0,
                'A newly added image must postpone DeepScan settling.');
            state.consumeScope();

            const carousel = document.createElement('section');
            carousel.className = 'carousel';
            testRoot.append(carousel);
            await waitForMutations();
            state.consumeScope();
            state.registerGenericRoot(carousel);

            const lazyImage = document.createElement('img');
            lazyImage.setAttribute('data-src', '/images/lazy.jpg');
            carousel.append(lazyImage);
            await waitForMutations();

            const carouselScope = state.consumeScope();
            assert(carouselScope.roots.includes(lazyImage),
                'A new carousel child must remain a narrow delta root.');
            assert(carouselScope.dirtyGenericRoots.has(carousel),
                'A changed known carousel must be marked dirty.');

            state.markGenericRootProcessed(carousel);
            state.registerPendingGenericRoot(carousel);
            activities.length = 0;
            carousel.setAttribute('aria-current', 'true');
            await waitForMutations();

            const pendingStateActivity = activities.at(-1);
            assert(pendingStateActivity.settleRecords.length > 0,
                'A pending Carousel state change must postpone DeepScan settling.');
            const pendingStateScope = state.consumeScope();
            assert(pendingStateScope.roots.includes(carousel),
                'A pending carousel state change must requeue its root.');
            assert(pendingStateScope.dirtyGenericRoots.has(carousel),
                'A pending carousel state change must mark its root dirty.');
            state.markGenericRootReady(carousel);
            const metrics = state.getMetrics();
            assert(metrics.knownGenericRoots === 1, 'The known carousel count must be retained.');
            assert(metrics.pendingGenericRootObservers === 1,
                'A missing Carousel state must receive a narrow observer.');
            assert(metrics.pendingGenericStateRoots === 0,
                'A ready Carousel root must no longer remain pending.');
            assert(metrics.deltaRoots >= 2, 'Delta roots must be counted.');
            state.stop();

            document.documentElement.dataset.deepScanDomStateResult = 'passed';
        } catch (error) {
            document.documentElement.dataset.deepScanDomStateResult = 'failed';
            document.documentElement.dataset.deepScanDomStateError = error.message;
        }
    </script>
</body>
</html>
